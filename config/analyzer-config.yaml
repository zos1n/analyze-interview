# 面试录屏分析工具共享配置
# Codex 与 Claude Code 两侧入口共用；路径、镜像、阈值、词表、模型版本只改这里。
# 网络策略（pip 源、HF_ENDPOINT、NO_PROXY）以规范阶段 0 预检实测为准，
# 本文件只提供备选镜像，不预设代理端口或连通性结论。

runtime:
  venv_path: ~/.local/share/interview-analyzer/.venv   # 全机共享，不在任何产物目录内
  python: python3        # 系统 CommandLineTools 3.9.6，与首次成功执行一致
  ffmpeg: /opt/homebrew/bin/ffmpeg

network:
  pypi_mirror: https://pypi.tuna.tsinghua.edu.cn/simple   # 预检失败时启用
  hf_mirror: https://hf-mirror.com

interview:
  domain: frontend       # frontend | backend | algorithm → 决定词表
  vocab_prompt: "AI Coding, Claude Code, Agent, Planner, Reviewer, Hooks, Skills, Subagent, React, SSE, RAG, Node.js, TypeScript, Webpack, Vite"
  asr_term_map:
    reg: RAG
    "Cloud Code": "Claude Code"
    上约文: 上下文

thresholds:
  disk_min_gb: 5
  coverage_auto: 0.4     # 主题簇覆盖率超此值出选项菜单
  loop_repeat_min: 3     # 重复循环检测阈值
  loop_text_min_chars: 8 # 重复循环检测的最小文本长度（首次执行教训：6 字「我看你不喜歡」×27 在 20 阈值下漏检）
  silence_energy_window_ms: 100  # 静音能量计算窗口（毫秒）
  silence_rms_threshold: 0.005   # 静音 RMS 阈值（低于此值视为静音）
  timestamp_gap_seconds: 30      # 时间戳断档检测阈值

indexing:
  # 主题簇关键词（规范阶段 4 用）。
  # 匹配规则：ASCII 词按词边界 + 不区分大小写匹配，中文按子串匹配；
  # 避免 "AI" 命中 said/wait 等英文子串导致覆盖虚高（首次执行教训）。
  ai_coding_keywords:            # AI Coding 类主题簇
    - AI
    - Coding
    - Agent
    - Planner
    - Reviewer
    - Hook
    - Hooks
    - Skill
    - Skills
    - Subagent
    - 工作流
    - prompt
    - Prompt
    - MCP
    - Claude Code
  project_keywords:              # 项目经历类主题簇
    - 项目
    - 负责
    - 主导
    - 难点
    - 指标
    - 收益
    - 架构
    - 方案
    - 上线
    - 迭代
    - 重构
    - 优化
    - 团队
    - 需求
  question_patterns:             # 问句事件视图（问句表达）
    - 为什么
    - 怎么
    - 如何
    - 有没有
    - 介绍一下
    - 具体说说
  reverse_question_patterns:     # 反问环节定位（结尾 1/3 区域搜索）
    - 还有什么问题
    - 有什么想问
    - 有什么想了解
    - 想问一下
    - 想了解一下
    - 了解一下
    - 待遇
    - 薪资
    - 加班
    - 福利
    - 晋升
    - 转正
    - 入职
    - 几轮面试
    - 团队规模
    - 业务方向
    - 技术栈

models:
  mlx_whisper: "0.4.3"
  small: mlx-community/whisper-small-mlx
  small_revision: 45f3915923c7a79a5a5b5a7d909d39aeb0e5630e
  turbo: mlx-community/whisper-large-v3-turbo
  turbo_revision: a4aaeec0636e6fef84abdcbe3544cb2bf7e9f6fb
